name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check .
      - name: Validate compose file
        run: docker compose config --quiet

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e . -r requirements-dev.txt
      - run: pytest -q

  # Real NPM container. Not required while its flakiness is unknown.
  integration:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      npm:
        image: jc21/nginx-proxy-manager:2.16.0
        ports:
          - 8181:81
        env:
          DISABLE_IPV6: "true"
        # the image refuses to start unless these paths are mounted
        volumes:
          - npm-data:/data
          - npm-letsencrypt:/etc/letsencrypt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e . -r requirements-dev.txt
      - run: pytest -q tests/integration
        env:
          NPM_LIVE_URL: http://localhost:8181
