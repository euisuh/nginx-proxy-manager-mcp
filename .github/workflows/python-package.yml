name: Python Package

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    paths:
      - '.github/workflows/python-package.yml'
      - 'nginx_proxy_manager_mcp/**'
      - 'pyproject.toml'
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
